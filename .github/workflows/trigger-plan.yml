name: Trigger Plan Activation

# Fires when the `needs-plan` label is applied to an issue.
#
# Covers three cases:
#
# 1. Plan file already merged into main but `plan-merged-dispatcher` failed or
#    was never triggered: re-run the activation logic (write checklist, transition
#    labels). This is the primary recovery path.
#
# 2. `needs-plan` applied manually without a prior `spec-refiner` run AND no
#    existing plan file (skip-spec-refinement shortcut): transition directly to
#    `ready-for-implementation` with an informational comment.
#
# 3. `needs-plan` applied by `spec-refiner` (plan PR still open in flight):
#    skip silently. `plan-merged-dispatcher` will activate on plan PR merge.
#
# Guard conditions skip the job entirely for closed issues, issues flagged
# `human-review`, and issues that already reached `ready-for-implementation`.
#
# Token: must be a PAT (`GH_AW_AGENT_TOKEN`), not `GITHUB_TOKEN`. Label events
# produced by `GITHUB_TOKEN` do not cascade to downstream workflows (GitHub
# anti-loop rule), which would leave `implementer-dispatcher` inert.

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  activate:
    if: github.event.label.name == 'needs-plan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plan files
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: docs/plans
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GH_AW_AGENT_TOKEN }}

      - name: Activate issue from plan file
        env:
          # Must be a PAT; GITHUB_TOKEN label events do not trigger downstream
          # workflows (GitHub anti-loop rule).
          GH_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ github.event.issue.state }}
        run: |
          set -euo pipefail

          # ── Guard 1: skip closed issues ────────────────────────────────────
          if [ "$ISSUE_STATE" = "closed" ]; then
            echo "Issue #$ISSUE_NUMBER is closed; skipping."
            exit 0
          fi

          # Fetch current labels from the API (more reliable than the event payload
          # for issues that were just labeled).
          ISSUE_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels \
            --jq '[.labels[].name] | @json')

          # ── Guard 2: skip if human-review is present ───────────────────────
          if echo "$ISSUE_LABELS" | grep -q '"human-review"'; then
            echo "Issue #$ISSUE_NUMBER has human-review label; skipping."
            exit 0
          fi

          # ── Guard 3: skip if already ready-for-implementation ──────────────
          if echo "$ISSUE_LABELS" | grep -q '"ready-for-implementation"'; then
            echo "Issue #$ISSUE_NUMBER already has ready-for-implementation; skipping."
            exit 0
          fi

          # ── Locate the plan file for this issue number ─────────────────────
          # Use both zero-padded (plan-066-*) and unpadded (plan-66-*) forms to
          # handle any naming variation without false-positive matches.
          ISSUE_PAD=$(printf '%03d' "$ISSUE_NUMBER")
          PLAN_FILE=$(find docs/plans -maxdepth 1 \
            \( -name "plan-${ISSUE_PAD}-*.md" -o -name "plan-${ISSUE_NUMBER}-*.md" \) \
            2>/dev/null | head -1 || true)

          if [ -z "$PLAN_FILE" ]; then
            # No plan file merged into main yet.
            if echo "$ISSUE_LABELS" | grep -q '"spec-refined"'; then
              # spec-refiner ran and opened a plan PR that has not merged yet.
              # plan-merged-dispatcher will activate the issue on plan PR merge.
              echo "Issue #$ISSUE_NUMBER has spec-refined label; plan PR is in flight. plan-merged-dispatcher will activate on merge."
              exit 0
            fi

            # No plan file and no spec-refined → skip-spec-refinement path.
            # Operator applied needs-plan directly to bypass spec-refiner.
            echo "Issue #$ISSUE_NUMBER: no plan file found and no spec-refined label. Transitioning needs-plan → ready-for-implementation (skip-spec path)."
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-plan 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --add-label ready-for-implementation
            gh issue comment "$ISSUE_NUMBER" --body \
              "**trigger-plan**: \`needs-plan\` was applied without a corresponding plan file. Transitioning directly to \`ready-for-implementation\`. To generate a structured plan instead, remove these labels and re-label with \`needs-spec\`."
            exit 0
          fi

          # ── Plan file found in main ─────────────────────────────────────────
          echo "Found plan file: $PLAN_FILE for issue #$ISSUE_NUMBER"

          plan_slug="${PLAN_FILE%.md}"
          plan_slug="$(basename "$plan_slug")"
          marker_begin="<!-- plan-checklist:${plan_slug}:begin -->"
          marker_end="<!-- plan-checklist:${plan_slug}:end -->"

          current_body=$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)

          # ── Idempotency: checklist already written ─────────────────────────
          if printf '%s' "$current_body" | grep -qF "$marker_begin"; then
            echo "Plan checklist already present in issue #$ISSUE_NUMBER; ensuring labels are correct."
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-plan 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --add-label ready-for-implementation 2>/dev/null || true
            exit 0
          fi

          # ── Extract the Implementation Checklist ───────────────────────────
          checklist=$(awk '
            /^## Implementation Checklist[[:space:]]*$/ { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' "$PLAN_FILE")

          if ! printf '%s' "$checklist" | grep -q '[^[:space:]]'; then
            echo "Plan file $PLAN_FILE has no Implementation Checklist section; transitioning labels only."
            gh issue edit "$ISSUE_NUMBER" --remove-label needs-plan 2>/dev/null || true
            gh issue edit "$ISSUE_NUMBER" --add-label ready-for-implementation
            echo "Activated issue #$ISSUE_NUMBER (no checklist to write)."
            exit 0
          fi

          # ── Write checklist into issue body (idempotent delimited block) ───
          cleaned_body=$(printf '%s' "$current_body" \
            | awk -v begin="$marker_begin" -v end="$marker_end" '
                index($0, begin) { skip=1; next }
                skip && index($0, end) { skip=0; next }
                !skip { print }
              ')

          cleaned_body=$(printf '%s' "$cleaned_body" | awk '
            /^[[:space:]]*$/ { blank++; next }
            { for (i=0;i<blank;i++) print ""; blank=0; print }
          ')

          {
            printf '%s\n' "$cleaned_body"
            printf '\n%s\n' "$marker_begin"
            printf '## Implementation Checklist (from %s)\n\n' "$plan_slug"
            printf '%s\n' "$checklist"
            printf '%s\n' "$marker_end"
          } > /tmp/issue_body.md

          gh issue edit "$ISSUE_NUMBER" --body-file /tmp/issue_body.md
          gh issue edit "$ISSUE_NUMBER" --remove-label needs-plan 2>/dev/null || true
          gh issue edit "$ISSUE_NUMBER" --add-label ready-for-implementation
          echo "Activated issue #$ISSUE_NUMBER from $PLAN_FILE."
