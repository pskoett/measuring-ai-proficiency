name: Sync Factory State

# Mirrors the factory label set onto the "AI Agent Factory" Projects v2 board's
# Status field. Labels are authoritative; this workflow derives the projected
# state one-way. Never reads field -> back to labels.
#
# Runs on:
#  - issue/PR state or label changes (per-item sync)
#  - scheduled cron every 5 min (reconcile all open items; safety net for missed
#    pull_request webhooks — events from gh CLI, gh api, and Copilot-created PRs
#    are not reliably delivered to workflow triggers)
#  - workflow_dispatch (manual resync of a specific item)
#
# Requires a repo secret PROJECTS_PAT with `project` scope (fine-grained PAT,
# access to pskoett/measuring-ai-proficiency + project permission read/write).
# GITHUB_TOKEN cannot be used: Projects v2 requires a user PAT.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, transferred]
  pull_request:
    types: [opened, edited, labeled, unlabeled, closed, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '*/5 * * * *'   # reconcile all open items every 5 min as a safety net for missed webhooks
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue or PR number to resync (leave empty for full reconcile)"
        required: false

permissions:
  contents: read

concurrency:
  # Only the latest event's state matters — queued stale events are wasted work.
  # Cancel in-progress so a fast-merging PR reflects its final state without
  # waiting for a backlog to drain (which was letting PRs skip the YourTurn lane
  # entirely when they merged faster than the queue could process earlier events).
  group: sync-factory-state-${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number || 'scheduled' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Compute Factory state and update project item
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}
          EVENT_MERGED: ${{ github.event.pull_request.merged || 'false' }}
        run: |
          set -euo pipefail

          PROJECT_ID='PVT_kwHOCpF41s4BU8ja'
          FIELD_ID='PVTSSF_lAHOCpF41s4BU8jazhMLwks'  # Status (4-column overview)

          # 4 lanes: Waiting for spec / Factory building / Your turn / Done.
          declare -A OPT=(
            [Waiting]='f75ad846'        # 📥 Waiting for spec
            [Factory]='47fc9ee4'        # 🤖 Factory building
            [YourTurn]='37fdf3fc'       # 👉 Your turn
            [Done]='675bf0bb'           # ✅ Done
          )

          sync_one() {
            local num="$1"

            local item_json labels node_id item_state is_pr is_draft
            item_json=$(gh api "repos/$REPO/issues/$num" \
              --jq '{labels: [.labels[].name], node_id: .node_id, state: .state, pr: (has("pull_request"))}' 2>/dev/null) || {
              echo "  skip #$num: not accessible"
              return 0
            }
            labels=$(echo "$item_json" | jq -r '.labels | join(",")')
            node_id=$(echo "$item_json" | jq -r '.node_id')
            item_state=$(echo "$item_json" | jq -r '.state')
            is_pr=$(echo "$item_json" | jq -r '.pr')

            # Draft status lives on the pulls endpoint, not the issues endpoint.
            # Draft PRs are still being worked on; they belong in Factory, not
            # in Your turn where they'd falsely signal "human needs to review".
            is_draft=false
            if [ "$is_pr" = "true" ]; then
              is_draft=$(gh api "repos/$REPO/pulls/$num" --jq '.draft' 2>/dev/null || echo false)
            fi

            local L=",$labels,"
            local state_name
            if [ "$item_state" = "closed" ]; then
              state_name=Done
            elif [[ "$L" == *",needs-changes,"* \
                 || "$L" == *",needs-rebase,"* \
                 || "$L" == *",human-review,"* \
                 || "$L" == *",blocked-on-human,"* \
                 || "$L" == *",ai-reviewed,"* \
                 || "$L" == *",plan-file,"* \
                 || "$L" == *",eval-regression,"* ]]; then
              state_name=YourTurn
            elif [ "$is_pr" = "true" ] && [ "$item_state" = "open" ] && [ "$is_draft" = "true" ]; then
              state_name=Factory
            elif [ "$is_pr" = "true" ] && [ "$item_state" = "open" ]; then
              state_name=YourTurn
            elif [[ "$L" == *",ready-for-implementation,"* \
                 || "$L" == *",assigned-to-agent,"* \
                 || "$L" == *",needs-plan,"* ]]; then
              state_name=Factory
            else
              state_name=Waiting
            fi
            local opt_id="${OPT[$state_name]}"
            echo "  #$num state=$item_state pr=$is_pr draft=$is_draft labels=[$labels] -> $state_name"

            local item_id
            item_id=$(gh api graphql -f query='
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }' -f projectId="$PROJECT_ID" -f contentId="$node_id" \
              --jq '.data.addProjectV2ItemById.item.id' 2>/dev/null) || return 0

            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optId }
                }) { projectV2Item { id } }
              }' -f projectId="$PROJECT_ID" -f itemId="$item_id" -f fieldId="$FIELD_ID" -f optId="$opt_id" \
              --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' >/dev/null || true

            case "$state_name" in
              YourTurn)
                gh issue edit "$num" --add-label your-turn --repo "$REPO" 2>/dev/null \
                  || gh pr edit "$num" --add-label your-turn --repo "$REPO" 2>/dev/null \
                  || true
                ;;
              *)
                gh issue edit "$num" --remove-label your-turn --repo "$REPO" 2>/dev/null \
                  || gh pr edit "$num" --remove-label your-turn --repo "$REPO" 2>/dev/null \
                  || true
                ;;
            esac

            # Strip stale factory-stage labels once the item is Done so the board
            # reflects "where the item is now" instead of "every stage it passed".
            # Attribute labels (impl:*, enhancement, documentation, bug, spec-drift,
            # plan-file, agentic-workflows, ci-fix, self-improvement) are preserved
            # as historical signal and intentionally excluded.
            if [ "$state_name" = "Done" ]; then
              local stale_present=""
              for stale_label in needs-spec needs-plan ready-for-implementation \
                                 assigned-to-agent ai-reviewed needs-changes fast-track \
                                 needs-rebase blocked-on-human human-review spec-refined; do
                if [[ "$L" == *",$stale_label,"* ]]; then
                  stale_present="${stale_present:+$stale_present,}$stale_label"
                fi
              done
              if [ -n "$stale_present" ]; then
                echo "  #$num Done: stripping stale labels [$stale_present]"
                gh issue edit "$num" --remove-label "$stale_present" --repo "$REPO" 2>/dev/null \
                  || gh pr edit "$num" --remove-label "$stale_present" --repo "$REPO" 2>/dev/null \
                  || true
              fi
            fi
          }

          if [ -z "${ISSUE_NUMBER}" ]; then
            # Reconcile every item currently on the project board via GraphQL.
            # The earlier `gh project item-list` approach broke in CI with
            # `unknown owner type` because the PAT-auth context inside the
            # workflow cannot infer user-vs-org from `--owner`. The earlier
            # `gh issue/pr list --limit 30` approach missed items older than
            # the 30 most recent, so closed issues drifted into 📥 Waiting
            # for spec and stayed there forever. GraphQL-by-project-ID is
            # the only shape that works here — it uses the same token and
            # PROJECT_ID the rest of this script already relies on.
            echo "No item number — full reconcile across every board item via GraphQL."
            ITEMS=$(gh api graphql -f query='
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 250) {
                      nodes {
                        content {
                          ... on Issue { number }
                          ... on PullRequest { number }
                        }
                      }
                    }
                  }
                }
              }' -f projectId="$PROJECT_ID" \
              --jq '[.data.node.items.nodes[].content.number // empty] | unique | .[]')
            for n in $ITEMS; do
              sync_one "$n" || true
            done
          else
            sync_one "$ISSUE_NUMBER"
          fi
