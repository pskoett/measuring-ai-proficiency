name: Factory Smoke Test

# Dispatches each safely-dispatchable factory workflow and asserts it
# completes with conclusion=success. Catches environment-level regressions
# (protected-files, network sandbox, YAML parse, schema drift) without
# needing a real feature task to ride through the chain.
#
# Triggers:
#   - Manual workflow_dispatch only — run before/after factory changes or
#     when you want a clean baseline. No cron: smoke runs dispatch real
#     factory workflows and we don't want that happening unattended.
#
# Runs: scripts/factory-smoke.sh. Results surface as a step summary plus
# the script's non-zero exit on any failure.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # needed so the script can dispatch other workflows
  issues: read
  pull-requests: read

concurrency:
  group: factory-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
      GH_AW_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Run factory-smoke.sh
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          bash scripts/factory-smoke.sh --wait-secs 600 2>&1 | tee /tmp/smoke.log
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Post results to step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Factory Smoke Test"
            echo ""
            echo "Triggered: \`${{ github.event_name }}\`"
            echo ""
            echo '```'
            cat /tmp/smoke.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
