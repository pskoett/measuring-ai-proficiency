name: Lock File Sync

# Blocks merge when gh-aw workflow .md frontmatter and compiled .lock.yml files diverge.
# See https://github.com/pskoett/measuring-ai-proficiency/issues/95 for context.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/*.md"
      - ".github/workflows/*.lock.yml"

permissions:
  contents: read

jobs:
  check-lock-sync:
    name: Check workflow lock files are in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/githubnext/gh-aw/refs/heads/main/install-gh-aw.sh | bash
          gh aw version

      - name: Recompile workflow lock files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh aw compile

      - name: Detect stale lock files
        run: |
          # Collect modified existing lock files and any newly-generated ones,
          # scoped to .github/workflows/ to avoid matching lock files elsewhere.
          stale_files=$(
            { git diff --name-only -- ".github/workflows/*.lock.yml"
              git ls-files --others --exclude-standard -- ".github/workflows/*.lock.yml"; } \
            | grep -v '^$'
          )

          if [ -z "$stale_files" ]; then
            echo "All workflow lock files are in sync with their source .md files."
            exit 0
          fi

          echo "Stale workflow lock files detected. Regenerate each one before merging."
          echo ""
          while IFS= read -r f; do
            name=$(basename "$f" .lock.yml)
            echo "  $f  ->  gh aw compile $name"
            echo "::error file=$f::Lock file is stale. Regenerate with: gh aw compile $name"
          done <<< "$stale_files"
          echo ""
          echo "To regenerate all stale files at once:"
          echo "  gh aw compile"
          echo ""
          echo "Commit the updated .lock.yml files and push to pass this check."
          echo "Refs: https://github.com/pskoett/measuring-ai-proficiency/issues/95"
          exit 1
